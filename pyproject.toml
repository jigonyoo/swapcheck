[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swapcheck"
version = "0.2.0"
description = "Compare two recorded eval runs case by case before switching models or prompts, and block when a failure you named rises by more than chance"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
authors = [{name = "Jigon Yoo"}]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["llm", "evaluation", "regression", "promptfoo", "statistics"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://jigonyoo.com"
Source = "https://github.com/jigonyoo/swapcheck"
Issues = "https://github.com/jigonyoo/swapcheck/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
crosscheck = ["pytest>=7", "scipy>=1.10", "errorbars==0.2.4"]

[project.scripts]
swapcheck = "swapcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swapcheck = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
